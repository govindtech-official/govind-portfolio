<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <meta name="robots" content="noindex">
  <title>Chapter not found — Govind Raj</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 54%,#26141d,#09090d 66%)}
    .error-content{max-width:520px}
    .error-code{font:800 clamp(100px,24vw,190px)/.8 var(--condensed);color:#f0445544;margin:0 0 20px}
    .error-content h1{font:700 34px var(--condensed);margin:0}
    .error-content p:not(.eyebrow){color:#aaa3ac;font-size:13px;margin:12px 0 24px}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-content">
      <p class="eyebrow"><span class="live-dot"></span> OUT OF FRAME</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>This chapter isn't here.</h1>
      <p>The page may have moved. The rest of the story is still waiting.</p>
      <a class="button button-primary" href="index.html">Return to the portfolio <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
